name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Backend build and test
        working-directory: playground/backend
        run: |
          npm ci
          npm run build
          npm test -- --run

      - name: Frontend build
        working-directory: playground/frontend
        run: |
          npm ci
          npm run build

      - name: Example typechecks (all 7 examples)
        run: |
          for dir in examples/0*; do
            echo "=== $dir ==="
            cd "$dir"
            npm ci
            npm run typecheck 2>/dev/null || npx tsc --noEmit
            cd -
          done

      - name: Example smoke tests
        run: |
          set -e
          cd examples/01-manual-loop
          timeout 10s npm run start
          cd -
          cd examples/06-mini-agent-cli
          set +e
          timeout 5s npm run start
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi

  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name == 'push'
    needs: [quality, build-docs]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
